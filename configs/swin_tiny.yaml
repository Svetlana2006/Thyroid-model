arch: swin_tiny

data_root: data_raw/TN5000_forReview
train_txt: data_raw/TN5000_forReview/ImageSets/Main/train.txt
val_txt: data_raw/TN5000_forReview/ImageSets/Main/val.txt
test_txt: data_raw/TN5000_forReview/ImageSets/Main/test.txt

img_size: 224
imagenet_mean: [0.485, 0.456, 0.406]
imagenet_std: [0.229, 0.224, 0.225]

head_hidden: 256
dropout: 0.3

pos_weight: null
pos_weight_scale: 1.0
label_smooth_eps: 0.05

lr_head: 3.0e-4
weight_decay: 1.0e-4
grad_clip_norm: 1.0

T_0: 10
T_mult: 2

batch_size: 16    # fixed for memory
max_epochs: 25            # intentional cap; best validation performance occurred by ~epoch 15
patience: 10
min_delta: 0.001
random_seed: 42

# Swin stochastic depth rate: 0.1 (timm default for tiny variant)
stochastic_depth_rate: 0.1
